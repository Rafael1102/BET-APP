name: Publicar APK Android

on:
  push:
    branches: [main]
    paths: [pubspec.yaml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Identificar a versão
        id: version
        run: |
          version=$(sed -nE 's/^version: ([^+]+)\+[0-9]+$/\1/p' pubspec.yaml)
          test -n "$version"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar o Java
        if: steps.version.outputs.published != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar o Flutter
        if: steps.version.outputs.published != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'

      - name: Compilar o APK
        if: steps.version.outputs.published != 'true'
        run: flutter build apk --release

      - name: Publicar a versão no GitHub
        if: steps.version.outputs.published != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          apk="BET-APP-${RELEASE_TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "$apk" \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes "${options[@]}"
